<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="caseCrmTitle caseCrmDesc">
  <title id="caseCrmTitle">Результат кейса по клиентской базе: 83% обращений не доходили до записи</title>
  <desc id="caseCrmDesc">Аудит 300+ обращений в Битрикс24 выявил 83% потерь на этапе обработки звонка.</desc>

  <rect width="600" height="360" rx="16" fill="#eef3ff"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#ffffff" stroke="#dbe4f5"/>

  <text x="44" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#8a94a6">АНАЛИТИКА</text>

  <rect x="450" y="40" width="106" height="30" rx="15" fill="#eef3ff"/>
  <text x="503" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0044cc">Битрикс24</text>

  <text x="44" y="152" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#111111">83%</text>
  <text x="44" y="186" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#667085">обращений не доходили до записи</text>

  <line x1="44" y1="216" x2="556" y2="216" stroke="#e6eaf0" stroke-width="1"/>

  <text x="44" y="280" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0044cc">300+</text>
  <text x="44" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">обращений в клиентской базе</text>

  <text x="320" y="280" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111111">24/7</text>
  <text x="320" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">контроль очереди</text>
</svg>
