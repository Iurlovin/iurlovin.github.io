<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="caseSermTitle caseSermDesc">
  <title id="caseSermTitle">Результат кейса: рейтинг 4.7 на Яндекс Картах</title>
  <desc id="caseSermDesc">Рейтинг вырос до 4.7, автосервис занял первое место среди 172 конкурентов и получает 2–3 новых отзыва в день.</desc>

  <rect width="1200" height="560" rx="24" fill="#eef3ff"/>
  <rect x="32" y="32" width="1136" height="496" rx="18" fill="#ffffff" stroke="#dbe4f5"/>

  <text x="72" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8a94a6">ЯНДЕКС КАРТЫ</text>

  <rect x="890" y="64" width="246" height="42" rx="21" fill="#eef3ff"/>
  <text x="1013" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0044cc">★ Хорошее место</text>

  <text x="72" y="260" font-family="Arial, Helvetica, sans-serif" font-size="160" font-weight="700" fill="#111111">4.7</text>
  <text x="390" y="250" font-family="Arial, Helvetica, sans-serif" font-size="88" fill="#f5c518">★</text>
  <text x="72" y="305" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#667085">рейтинг</text>

  <line x1="72" y1="350" x2="1128" y2="350" stroke="#e6eaf0" stroke-width="2"/>

  <text x="72" y="455" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#0044cc">#1</text>
  <text x="72" y="495" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555555">из 172 конкурентов</text>

  <text x="360" y="455" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#111111">+2–3</text>
  <text x="360" y="495" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555555">отзыва в день</text>

  <text x="650" y="455" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#111111">16%</text>
  <text x="650" y="495" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555555">доля рынка</text>

  <text x="920" y="455" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#0044cc">~610</text>
  <text x="920" y="495" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555555">новых отзывов за год</text>
</svg>
