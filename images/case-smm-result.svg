<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="caseSmmTitle caseSmmDesc">
  <title id="caseSmmTitle">Результат кейса по соцсетям: 240 000 ₽ выручки из ВКонтакте</title>
  <desc id="caseSmmDesc">Выручка 240 000 ₽ из ВКонтакте без рекламного бюджета в пиковый месяц.</desc>

  <rect width="600" height="360" rx="16" fill="#eef3ff"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#ffffff" stroke="#dbe4f5"/>

  <text x="44" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#8a94a6">СОЦСЕТИ</text>

  <rect x="430" y="40" width="126" height="30" rx="15" fill="#eef3ff"/>
  <text x="493" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0044cc">без бюджета</text>

  <text x="44" y="152" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#111111">240 000 ₽</text>
  <text x="44" y="186" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#667085">выручки из ВКонтакте</text>

  <line x1="44" y1="216" x2="556" y2="216" stroke="#e6eaf0" stroke-width="1"/>

  <text x="44" y="280" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0044cc">0 ₽</text>
  <text x="44" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">рекламный бюджет</text>

  <text x="320" y="280" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111111">июль</text>
  <text x="320" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">пиковый месяц</text>
</svg>
